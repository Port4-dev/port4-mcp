name: Port4 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - name: Install dependencies
        run: |
          npm ci
          npm --prefix web ci
      - name: Typecheck Worker & SPA
        run: npm run typecheck
      - name: Build Frontend SPA
        run: npm run build:web
      - name: Run Conformance & Security Suite
        run: npm test
      - name: Run port4-mcp CLI Self-Test
        run: npm run test:cli
      - name: Run Local Workerd E2E Suite
        run: |
          trap 'rm -f .dev.vars' EXIT
          printf 'JWT_SECRET=%s\n' "$(openssl rand -hex 32)" > .dev.vars
          npm run test:e2e
